name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The versions pyproject.toml claims support for.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - run: pip install -e ".[dev]"

      - run: python -m ruff format --check .

      - run: python -m ruff check .

      - run: python -m pytest -q

  sandbox:
    # The sandbox tests skip where bwrap or docker is missing; here they must run.
    runs-on: ubuntu-latest
    env:
      DEEPHARNESS_REQUIRE_SANDBOXES: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: sudo apt-get update && sudo apt-get install -y bubblewrap

      # Ubuntu 24.04 restricts the unprivileged user namespaces bwrap is built on.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - run: docker pull python:3.12-slim

      - run: pip install -e ".[dev]"

      - run: python -m pytest -q -rs tests/test_sandbox.py

site_name: Subagents
site_description: Compose LLM agents into typed, concurrent workflows.
repo_name: subagents
repo_url: https://github.com/your-org/subagents
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/mark.svg
  favicon: assets/mark.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guide:
      - Graphs: guide/graph.md
      - Agents: guide/agents.md
      - Tools: guide/tools.md
      - Providers: guide/providers.md
  - Examples: examples.md
  - API reference: reference/api.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/your-org/subagents

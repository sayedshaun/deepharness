<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeepHarness</title>
<style>
  :root {
    --bg: #fbfbfd; --panel: #fff; --line: #e4e4ea; --ink: #1c1c22;
    --muted: #6b6b78; --accent: #6e63f5; --ok: #1f9254; --warn: #b26a00;
    --bad: #c0392b; --code: #f4f4f8; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14141a; --panel: #1b1b23; --line: #2c2c38; --ink: #ececf2;
      --muted: #9a9aab; --accent: #9d95ff; --ok: #4cc38a; --warn: #e2a03f;
      --bad: #f06a5d; --code: #22222c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 system-ui, sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  header .meta { color: var(--muted); font: 12px/1.4 var(--mono); }
  header .spacer { flex: 1; }
  button {
    font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--bad); }
  button:disabled { opacity: 0.5; cursor: default; }
  main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 300px; min-height: 0; }
  @media (max-width: 760px) { main { grid-template-columns: minmax(0, 1fr); } aside { display: none; } }
  #log { overflow-y: auto; padding: 18px 16px 8px; display: flex; flex-direction: column; gap: 12px; }
  .turn { max-width: 760px; width: 100%; margin: 0 auto; }
  .who { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .bubble {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 13px; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .turn.you .bubble { background: color-mix(in oklab, var(--accent) 12%, var(--panel)); }
  .event {
    border: 1px solid var(--line); border-radius: 10px; background: var(--panel);
    margin: 6px 0; font-size: 13px; overflow: hidden;
  }
  .event > summary {
    cursor: pointer; padding: 7px 11px; display: flex; gap: 8px; align-items: center;
    font-family: var(--mono); font-size: 12px; list-style: none;
  }
  .event > summary::-webkit-details-marker { display: none; }
  .event pre {
    margin: 0; padding: 10px 12px; background: var(--code); border-top: 1px solid var(--line);
    font: 12px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 320px; overflow: auto;
  }
  .tag { font: 11px var(--mono); padding: 1px 6px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .think > summary { color: var(--accent); }
  .think pre { color: var(--muted); font-style: italic; }
  .think[open] > summary .dots::after {
    content: "…"; animation: blink 1.2s steps(4, end) infinite;
  }
  @keyframes blink { 0%, 100% { opacity: 0.3 } 50% { opacity: 1 } }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }
  .step { color: var(--muted); font: 12px var(--mono); text-align: center; margin: 4px 0; }
  .gate {
    border: 1px solid var(--warn); border-radius: 12px; padding: 12px 14px; background: var(--panel);
  }
  .gate h3 { margin: 0 0 6px; font-size: 13px; color: var(--warn); }
  .gate pre { background: var(--code); padding: 8px 10px; border-radius: 8px; margin: 8px 0;
              font: 12px/1.5 var(--mono); white-space: pre-wrap; }
  .gate .row { display: flex; gap: 8px; }
  aside { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 14px; }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 8px; }
  aside ul { list-style: none; margin: 0 0 16px; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  aside li button {
    width: 100%; text-align: left; border: 0; background: none; padding: 5px 7px; border-radius: 7px;
    font: 12px var(--mono); display: flex; justify-content: space-between; gap: 8px;
  }
  aside li button:hover { background: var(--code); }
  aside li span { color: var(--muted); }
  form { border-top: 1px solid var(--line); background: var(--panel); padding: 12px 16px; }
  .composer { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; font: inherit; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); min-height: 44px; max-height: 180px;
  }
  textarea:focus { outline: 2px solid color-mix(in oklab, var(--accent) 50%, transparent); outline-offset: -1px; }
  dialog {
    border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink);
    max-width: min(900px, 92vw); width: 100%; padding: 0;
  }
  dialog::backdrop { background: rgb(0 0 0 / 0.45); }
  dialog header { border-bottom: 1px solid var(--line); }
  dialog pre { margin: 0; padding: 14px; font: 12px/1.6 var(--mono); white-space: pre-wrap;
               max-height: 65vh; overflow: auto; }
  .hint { color: var(--muted); font-size: 12px; text-align: center; padding: 24px 0; }
</style>
</head>
<body>
<header>
  <h1>DeepHarness</h1>
  <div class="meta" id="meta">connecting…</div>
  <div class="spacer"></div>
  <button id="reset" class="danger">New conversation</button>
</header>

<main>
  <div id="log">
    <p class="hint">Ask it to write some code. It works only inside its workspace, and pauses before writing or running anything.</p>
  </div>
  <aside>
    <h2>Workspace</h2>
    <ul id="files"></ul>
    <h2>Tools</h2>
    <ul id="tools"></ul>
  </aside>
</main>

<form id="composer">
  <div class="composer">
    <textarea id="input" placeholder="Write fizzbuzz to fizz.py, then run it" autofocus></textarea>
    <button class="primary" id="send" type="submit">Send</button>
  </div>
</form>

<dialog id="viewer">
  <header><strong id="viewer-name" style="font:12px var(--mono)"></strong><div class="spacer"></div>
    <button onclick="document.getElementById('viewer').close()">Close</button></header>
  <pre id="viewer-body"></pre>
</dialog>

<script>
const log = document.getElementById("log");
const filesEl = document.getElementById("files");
const toolsEl = document.getElementById("tools");
const input = document.getElementById("input");
const send = document.getElementById("send");
const meta = document.getElementById("meta");

let busy = false;

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function scroll() { log.scrollTop = log.scrollHeight; }

function turn(who, text) {
  const wrap = el("div", `turn ${who === "You" ? "you" : ""}`);
  wrap.append(el("div", "who", who), el("div", "bubble", text ?? ""));
  log.append(wrap);
  scroll();
  return wrap.querySelector(".bubble");
}

function details(summaryNodes, body) {
  const box = el("details", "event");
  const summary = el("summary");
  summary.append(...summaryNodes);
  box.append(summary);
  if (body !== undefined) box.append(el("pre", null, body));
  return box;
}

function currentTurn() {
  const last = log.querySelector(".turn:last-child");
  return last && !last.classList.contains("you") ? last : null;
}

/** Read a server-sent event stream from a POST, handing each object to `onEvent`. */
async function stream(url, body, onEvent) {
  const response = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body ?? {}),
  });
  if (!response.ok) {
    onEvent({ type: "error", message: `${response.status} ${await response.text()}` });
    return;
  }
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const chunks = buffer.split("\n\n");
    buffer = chunks.pop();
    for (const chunk of chunks) {
      const line = chunk.split("\n").find((l) => l.startsWith("data: "));
      if (line) onEvent(JSON.parse(line.slice(6)));
    }
  }
}

function render(event, ctx) {
  const holder = ctx.holder;
  switch (event.type) {
    case "step":
      holder.append(el("div", "step", `— step ${event.step} —`));
      break;
    case "tool_start": {
      const args = JSON.stringify(event.arguments);
      ctx.open = details(
        [el("span", "tag", "tool"), el("strong", null, event.name), el("span", null, args.length > 70 ? args.slice(0, 70) + "…" : args)],
        "running…"
      );
      holder.append(ctx.open);
      break;
    }
    case "tool_end": {
      const box = ctx.open ?? details([el("span", "tag", "tool"), el("strong", null, event.name)], "");
      box.querySelector("summary").append(el("span", event.failed ? "bad" : "ok", event.failed ? " failed" : " ok"));
      box.querySelector("pre").textContent = event.result;
      if (!box.parentNode) holder.append(box);
      ctx.open = null;
      break;
    }
    case "thinking":
      if (!ctx.thinking) {
        ctx.thinking = details([el("span", "tag", "reasoning"), el("span", "dots")], "");
        ctx.thinking.className = "event think";
        ctx.thinking.open = true;   // watchable while it happens
        holder.append(ctx.thinking);
      }
      ctx.thinking.querySelector("pre").textContent += event.text;
      break;
    case "text":
      if (!ctx.text) {
        // The answer has started, so the working folds away - it stays one
        // click from view rather than pushing the reply off the screen.
        if (ctx.thinking) {
          ctx.thinking.open = false;
          const chars = ctx.thinking.querySelector("pre").textContent.length;
          ctx.thinking.querySelector(".dots").textContent = ` ${chars} chars`;
        }
        ctx.text = el("div", "bubble", "");
        holder.append(ctx.text);
      }
      ctx.text.textContent += event.text;
      break;
    case "error":
      holder.append(details([el("span", "tag bad", "error")], event.message));
      break;
    case "done":
      meta.textContent = `${ctx.model} · ${event.usage.total} tokens · stopped: ${event.stop_reason}`;
      showFiles(event.files);
      if (event.paused.length) gate(event.paused, ctx);
      break;
  }
  scroll();
}

function gate(paused, ctx) {
  for (const call of paused) {
    const box = el("div", "gate");
    box.append(el("h3", null, "Waiting for you"));
    box.append(el("div", null, call.question));
    box.append(el("pre", null, `${call.name}(${JSON.stringify(call.arguments, null, 2)})`));
    const row = el("div", "row");
    const approve = el("button", "primary", "Approve & run");
    const reject = el("button", "danger", "Reject");
    approve.onclick = () => rule("/approve", call.call_id, box, ctx);
    reject.onclick = () => rule("/reject", call.call_id, box, ctx);
    row.append(approve, reject);
    box.append(row);
    ctx.holder.append(box);
  }
  scroll();
}

async function rule(url, callId, box, ctx) {
  box.remove();
  const next = { holder: ctx.holder, model: ctx.model, open: null, text: null, thinking: null };
  await stream(url, { call_id: callId }, (event) => render(event, next));
}

function showFiles(files) {
  filesEl.replaceChildren();
  if (!files.length) {
    filesEl.append(el("li", null, "")).firstChild;
    filesEl.lastChild.append(el("span", null, "empty"));
    return;
  }
  for (const file of files) {
    const item = el("li");
    const button = el("button");
    button.append(el("span", null, file.path), el("span", null, `${file.bytes} B`));
    button.onclick = () => view(file.path);
    item.append(button);
    filesEl.append(item);
  }
}

async function view(path) {
  const response = await fetch(`/file?path=${encodeURIComponent(path)}`);
  const data = await response.json();
  document.getElementById("viewer-name").textContent = path;
  document.getElementById("viewer-body").textContent = data.content ?? data.detail;
  document.getElementById("viewer").showModal();
}

async function submit(event) {
  event?.preventDefault();
  const message = input.value.trim();
  if (!message || busy) return;
  busy = true; send.disabled = true; input.value = "";
  log.querySelector(".hint")?.remove();
  turn("You", message);
  const holder = el("div", "turn");
  holder.append(el("div", "who", "Agent"));
  log.append(holder);
  const ctx = { holder, model: window.__model, open: null, text: null, thinking: null };
  try {
    await stream("/chat", { message }, (e) => render(e, ctx));
  } finally {
    busy = false; send.disabled = false; input.focus();
  }
}

document.getElementById("composer").addEventListener("submit", submit);
input.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey) submit(event);
});
document.getElementById("reset").onclick = async () => {
  const response = await fetch("/reset", { method: "POST" });
  const data = await response.json();
  log.replaceChildren(el("p", "hint", "New conversation. The workspace is untouched."));
  showFiles(data.files);
};

(async () => {
  const info = await (await fetch("/session")).json();
  window.__model = info.model;
  meta.textContent = `${info.model} · ${info.workspace}`;
  toolsEl.replaceChildren(...info.tools.map((name) => {
    const item = el("li");
    item.append(el("button", null, name));
    return item;
  }));
  showFiles(info.files);
  if (info.paused.length) {
    const holder = el("div", "turn");
    holder.append(el("div", "who", "Agent"));
    log.append(holder);
    gate(info.paused, { holder, model: info.model });
  }
})();
</script>
</body>
</html>

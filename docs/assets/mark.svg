    <line x1="200" y1="215" x2="205" y2="350"/>
    <line x1="200" y1="215" x2="90" y2="290"/>
  </g>

  <!-- satellite nodes -->
  <g fill="url(#nodeSat)">
    <path d="M268,62 245,101.84 199,101.84 176,62 199,22.16 245,22.16 Z"/>
    <path d="M342,128 321,164.37 279,164.37 258,128 279,91.63 321,91.63 Z"/>
    <path d="M344,300 322,338.1 278,338.1 256,300 278,261.9 322,261.9 Z"/>
    <path d="M249,350 227,388.1 183,388.1 161,350 183,311.9 227,311.9 Z"/>
    <path d="M134,290 112,328.1 68,328.1 46,290 68,251.9 112,251.9 Z"/>

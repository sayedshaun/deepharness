<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="410" viewBox="0 0 400 410" role="img" aria-label="DeepHarness">
  <defs>
    <linearGradient id="nodeCenter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6E63F5"/>
      <stop offset="100%" stop-color="#3B2FCB"/>

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "deepharness"
version = "0.1.1"
description = "Compose LLM agents into typed, concurrent workflows."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sayed Shaun", email = "sayedshaun4@gmail.com" }]
keywords = ["agents", "llm", "workflow", "graph", "async"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx"]

[project.urls]
Homepage = "https://github.com/sayedshaun/deepharness"
Documentation = "https://sayedshaun.github.io/deepharness/"
Repository = "https://github.com/sayedshaun/deepharness"
Issues = "https://github.com/sayedshaun/deepharness/issues"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]
docs = ["mkdocs", "mkdocs-material"]

[tool.setuptools.packages.find]
include = ["deepharness*"]

[tool.setuptools.package-data]
deepharness = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py311"
